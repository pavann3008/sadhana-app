<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sadhana — Daily Spiritual Practice</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1A0A2E;
      color: #F5EFE6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;

      display: flex;
      flex-direction: column;
      gap: 16px;

      max-width: 320px;
    }

      text-align: center;
      font-size: 0.95rem;

    .links a:hover { background: rgba(255,107,0,0.12); border-color: #FF6B00; }
    footer {

      color: #7A6A5A;
